name: Update jobs & deploy

on:
  schedule:
    # off the full hour, where GitHub delays or drops scheduled runs; twice a day as a safety net
    - cron: "23 4 * * *"   # 07:23 Istanbul
    - cron: "23 12 * * *"  # 15:23 Istanbul
  workflow_dispatch:      # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch new jobs
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fetch]')
        run: python3 jobfinder.py fetch

      - name: Rescore with current config
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[fetch]')
        run: python3 jobfinder.py rescore

      - name: Save job data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/meta.json
          git diff --cached --quiet || git commit -m "Update jobs [skip ci]"
          # the Mac may publish the shared view at the same moment: catch up and retry instead of failing the deploy
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 6; done

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          python3 jobfinder.py export _site/data/static.json
          cp data/packs.enc.json _site/data/ 2>/dev/null || true   # encrypted packs, open only with Nesibe's passphrase

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
