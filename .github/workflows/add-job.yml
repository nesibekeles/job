name: Add a job or a city from the phone

# Nesibe shares a job link from her phone; it arrives as an issue titled "Add job" in this repo.
# This reads that one posting (never a crawl), adds and scores it, answers on the issue and redeploys the site.
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: add-job
  cancel-in-progress: false

jobs:
  add:
    # the repo is public: only issues opened by the owner are read
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.state == 'open' && (contains(github.event.issue.labels.*.name, 'add-job') || startsWith(github.event.issue.title, 'Add job') || startsWith(github.event.issue.title, 'Add city'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BODY: ${{ github.event.issue.body }}
      TITLE: ${{ github.event.issue.title }}
      N: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the posting
        run: |
          python3 - <<'PY'
          import os, re, json, jobfinder as jf
          body = os.environ.get("BODY") or ""
          m = re.search(r"https?://\S+", body)
          if os.environ.get("TITLE", "").startswith("Add city"):  # "Add city: Zurich" with lines country: / priority: / target:
              f = dict(re.findall(r"(?im)^\s*(country|priority|target)\s*:\s*(.+?)\s*$", body))
              city = os.environ["TITLE"].split(":", 1)[-1].strip()
              try:
                  added = jf.add_city(city, f.get("country", ""), f.get("priority", 6), re.sub(r"\D", "", f.get("target", "")) or None)
                  out = {"ok": True, "city": city, "added": added}
              except Exception as e:
                  out = {"ok": False, "error": str(e)[:200]}
              json.dump(out, open("result.json", "w"))
              open("comment.md", "w").write((f"Added **{city}** to your cities. Jobs there arrive with the next update (a few minutes)." if out.get("added") else f"**{city}** was already on your list.") if out["ok"] else f"Couldn't add the city: {out['error']}")
              raise SystemExit
          if not m:
              out = {"ok": False, "error": "There's no link in this issue."}
          else:
              url = m.group(0).rstrip(').,>"\'')
              try:
                  j = jf.add_url(url, body.replace(m.group(0), "").strip())
                  f = j.get("f", {})
                  out = {"ok": True, "id": j["id"], "company": j["company"], "title": j["title"], "city": f.get("city"), "filtered": f.get("filtered")}
              except Exception as e:
                  out = {"ok": False, "error": str(e)[:200]}
          json.dump(out, open("result.json", "w"))
          note = (f"Added **{out['title']}** at **{out['company']}** ({out['city']}). It shows up in Jobness in a few minutes."
                  + (f"\n\nHeads-up: it's filtered out of Discover because: {out['filtered']}. You'll find it under Passed → Filtered automatically." if out.get("filtered") else "")
                  if out["ok"] else
                  f"I couldn't read this posting ({out['error']}).\n\nEdit this issue and paste the job description under the link; I'll try again as soon as you save.")
          open("comment.md", "w").write(note)
          PY

      - name: Save, answer and redeploy
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('result.json'))['ok'] else 1)"; then
            git config user.name "job-radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/manual_jobs.json data/jobs.json config/cities.json
            git diff --cached --quiet || git commit -m "From the phone, issue #$N [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 6; done
            gh workflow run update.yml --ref main
            gh issue close "$N" --comment "$(cat comment.md)"
          else
            gh issue comment "$N" --body "$(cat comment.md)"
          fi
